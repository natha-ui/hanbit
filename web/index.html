<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="hanbit-host" content="pages">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한빛 학당">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9ECE3">
<title>한빛 학당 — Korean the way Korean children learn it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9ECE3; --sheet:#F6F7F1; --ink:#18212E; --ink2:#566070; --rule:#C9D0C2;
  --celadon:#4F8572; --celadon-soft:#D6E6DE; --indigo:#2A4A7C; --indigo-soft:#DCE3F0;
  --yolk:#E2B236; --yolk-soft:#F6E9C2; --miss:#B5483A; --miss-soft:#F2DAD5;
  --grid:#E3A7A0;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121720; --sheet:#1A212C; --ink:#E7EAE2; --ink2:#9AA3B0; --rule:#2E3846;
    --celadon:#7DB8A2; --celadon-soft:#1F3530; --indigo:#8FAEE0; --indigo-soft:#1E2A40;
    --yolk:#E8C25E; --yolk-soft:#3A3120; --miss:#E48476; --miss-soft:#3D2522; --grid:#7A4A46;
  }
}
:root[data-theme="dark"]{
  --paper:#121720; --sheet:#1A212C; --ink:#E7EAE2; --ink2:#9AA3B0; --rule:#2E3846;
  --celadon:#7DB8A2; --celadon-soft:#1F3530; --indigo:#8FAEE0; --indigo-soft:#1E2A40;
  --yolk:#E8C25E; --yolk-soft:#3A3120; --miss:#E48476; --miss-soft:#3D2522; --grid:#7A4A46;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:4px}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:.6rem;padding:.7rem 1.1rem .2rem;max-width:1100px;margin:0 auto}
.brand b{font-family:var(--serif);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.brand span{color:var(--ink2);font-size:.9rem}
nav.tabs{display:flex;gap:.25rem;overflow-x:auto;padding:.35rem 1rem .55rem;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid transparent;background:none;padding:.3rem .8rem;border-radius:999px;font-size:1rem;color:var(--ink2)}
nav.tabs button small{display:block;font-size:.66rem;line-height:1;opacity:.8}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--sheet)}
main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 4rem}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0 0 .5rem}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:900}
h2{font-size:1.35rem;font-weight:600;margin-top:1.8rem}
h3{font-size:1.1rem;font-weight:600}
p{margin:.2rem 0 .8rem;max-width:68ch}
.muted{color:var(--ink2)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:1.1rem 1.2rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:.55rem 1.1rem;border-radius:10px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:.3rem .7rem;font-size:.9rem}
.say{border:none;background:var(--celadon-soft);color:var(--celadon);width:2.1rem;height:2.1rem;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:.95rem}
.say:hover{background:var(--celadon);color:var(--sheet)}
.chip{border:1px solid var(--rule);background:var(--sheet);padding:.25rem .75rem;border-radius:999px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--sheet)}
.scroll{overflow-x:auto}

/* 깍두기 공책 — the practice-notebook grid square */
.kan{--s:4.2rem;width:var(--s);height:var(--s);display:grid;place-items:center;font-family:var(--serif);font-size:calc(var(--s)*.62);line-height:1;position:relative;border:1.5px solid var(--grid);background:
 linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
 linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,var(--sheet);}
.kan::before{content:"";position:absolute;inset:0;background:inherit;opacity:0}
.kan.lg{--s:7.5rem}
.kan.xl{--s:10rem}
.kan span{position:relative;background:transparent}
.kan.dash{background:
 repeating-linear-gradient(90deg,var(--grid) 0 3px,transparent 3px 7px) center/100% 1px no-repeat,
 repeating-linear-gradient(0deg,var(--grid) 0 3px,transparent 3px 7px) center/1px 100% no-repeat,var(--sheet)}

/* Today */
.today{display:grid;grid-template-columns:1fr;gap:1.4rem}
@media(min-width:860px){.today{grid-template-columns:1.25fr .9fr}}
.hero-word{display:flex;gap:1rem;align-items:center;margin:.8rem 0 1rem}
.stats{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.stats div{font-size:.9rem;color:var(--ink2)}
.stats b{display:block;font-family:var(--serif);font-size:1.6rem;color:var(--ink);line-height:1.1}
.path{list-style:none;padding:0;margin:.4rem 0}
.path li{display:grid;grid-template-columns:2rem 1fr auto;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--rule)}
.path li .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);font-size:.85rem;color:var(--ink2)}
.path li.done .n{background:var(--celadon);border-color:var(--celadon);color:var(--sheet)}
.path li.now .n{border-color:var(--yolk);background:var(--yolk-soft);color:var(--ink)}
.bar{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:.25rem}
.bar i{display:block;height:100%;background:var(--celadon)}
.phone{width:min(300px,100%);aspect-ratio:9/18.5;margin:0 auto;border-radius:38px;padding:14px;background:#0f141c;box-shadow:0 0 0 2px #2a3240}
.screen{height:100%;border-radius:28px;background:radial-gradient(120% 80% at 30% 10%,#3f6a60 0%,#22384a 45%,#141c28 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:2.2rem .9rem 1rem;text-align:center}
.screen .d{font-size:.85rem;opacity:.85}
.screen .t{font-family:var(--serif);font-size:3.6rem;font-weight:600;line-height:1;margin:.2rem 0 1rem}
.lsw{width:100%;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:.8rem .9rem;text-align:left}
.lsw .w{font-size:1.6rem;font-weight:700;line-height:1.2}
.lsw .w span{font-family:var(--serif);font-weight:400;opacity:.85;margin-left:.4rem}
.lsw .s{font-size:.82rem;opacity:.9}

/* Hangul */
.jamo{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4rem,1fr));gap:.6rem}
.jamo button{border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:.6rem .3rem;text-align:center}
.jamo button:hover{border-color:var(--celadon)}
.jamo .g{font-family:var(--serif);font-size:2.2rem;line-height:1.1;display:block}
.jamo .r{font-size:.8rem;color:var(--ink2)}
table.gana{border-collapse:collapse;font-family:var(--serif)}
table.gana th{font-size:.95rem;color:var(--ink2);font-weight:400;padding:.2rem .4rem}
table.gana td{padding:0}
table.gana td button{width:2.7rem;height:2.7rem;border:1px solid var(--rule);background:var(--sheet);font-size:1.3rem}
table.gana td button:hover{background:var(--yolk-soft)}
.builder{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.builder select{padding:.4rem .5rem;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-size:1.2rem}

/* Hanja */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.7rem}
.htile{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.htile .kan{--s:4.4rem}
.htile small{font-size:.82rem;color:var(--ink2)}
.htile.known small{color:var(--celadon)}
.detail{display:flex;gap:1.3rem;flex-wrap:wrap;align-items:flex-start}
.hunum{font-size:1.6rem;font-weight:700}

/* breakdown */
.bd{display:flex;align-items:stretch;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.bd-cell{display:flex;flex-direction:column;align-items:center;min-width:5rem;text-align:center}
.bd-cell .kan{--s:3.6rem}
.bd-hun{font-weight:700;margin-top:.25rem}
.bd-en{font-size:.82rem;color:var(--ink2);max-width:8rem;line-height:1.3}
.bd-note{font-size:.75rem;background:var(--yolk-soft);padding:0 .4rem;border-radius:4px;margin-top:.2rem}
.bd-plus{align-self:center;color:var(--ink2);padding-bottom:2rem}

/* words */
.wlist{border-top:1px solid var(--rule)}
.wlist details{border-bottom:1px solid var(--rule)}
.wlist summary{list-style:none;display:grid;grid-template-columns:2.2rem minmax(6rem,auto) 1fr auto;gap:.8rem;align-items:center;padding:.55rem .2rem;cursor:pointer}
.wlist summary::-webkit-details-marker{display:none}
.wlist .ko{font-size:1.2rem;font-weight:700}
.wlist .hj{font-family:var(--serif);color:var(--indigo);font-size:1.1rem}
.wlist .en{color:var(--ink2)}
.wlist .body{padding:0 .2rem 1rem 3rem}
.lv{font-size:.72rem;border:1px solid var(--rule);border-radius:4px;padding:0 .35rem;color:var(--ink2)}
input.search{width:100%;max-width:26rem;padding:.55rem .8rem;border-radius:10px;border:1px solid var(--rule);background:var(--sheet)}

/* grammar */
.gram details{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;margin:.6rem 0}
.gram summary{padding:.8rem 1rem;cursor:pointer;display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
.gram summary b{font-family:var(--serif);font-size:1.15rem}
.gram .inner{padding:0 1rem 1rem}
.eg{display:flex;gap:.7rem;align-items:center;padding:.35rem 0;border-bottom:1px dashed var(--rule)}
.eg .k{font-size:1.1rem}
.eg .e{color:var(--ink2);font-size:.9rem}
.q{margin:.7rem 0}
.q .p{font-size:1.1rem;margin-bottom:.3rem}
.q button.opt{border:1px solid var(--rule);background:var(--paper);padding:.3rem .9rem;border-radius:8px;margin-right:.4rem}
.q button.ok{background:var(--celadon-soft);border-color:var(--celadon)}
.q button.no{background:var(--miss-soft);border-color:var(--miss)}
.particles{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem;margin-top:.7rem}
.particles div{background:var(--paper);border-radius:8px;padding:.4rem .6rem}
.particles b{font-size:1.15rem;display:block}
.particles small{color:var(--ink2)}

/* stories */
.slist{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
.scard{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:1rem 1.1rem}
.scard h3{font-size:1.25rem}
.line{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem .4rem;border-radius:8px}
.line.on{background:var(--yolk-soft)}
.line .k{font-family:var(--serif);font-size:1.3rem;line-height:1.6;cursor:pointer}
.line .e{color:var(--ink2);font-size:.95rem;display:none}
.line.show .e{display:block}

/* review */
.card{max-width:34rem;margin:1rem auto;text-align:center}
.card .front{display:flex;flex-direction:column;align-items:center;gap:.5rem;min-height:12rem;justify-content:center}
.card .big{font-size:2.6rem;font-weight:700;line-height:1.2}
.card .hjsub{font-family:var(--serif);font-size:1.5rem;color:var(--indigo)}
.card .back{border-top:1px dashed var(--rule);margin-top:1rem;padding-top:1rem}
.card .bd{justify-content:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.grades button{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:.55rem .2rem;font-weight:600}
.grades button small{display:block;font-weight:400;font-size:.75rem;color:var(--ink2)}
.grades .g0{border-color:var(--miss)}
.grades .g2{border-color:var(--celadon);background:var(--celadon-soft)}
.tag{display:inline-block;font-size:.75rem;padding:.05rem .5rem;border-radius:999px;background:var(--indigo-soft);color:var(--indigo)}

label.set{display:block;margin:1rem 0}
input[type=range]{width:100%;max-width:26rem;accent-color:var(--celadon)}
textarea{width:100%;min-height:6rem;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:.6rem;font-size:.8rem;font-family:ui-monospace,monospace}
.notice{background:var(--yolk-soft);border-radius:10px;padding:.7rem 1rem;margin:.8rem 0}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.5rem 1rem;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>한빛 학당</b><span>Korean the way Korean children learn it</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ DATA ============ */
// [character, 훈 (native meaning), 음 (sound), English, level]
const HANJA=[
['一','한','일','one',1],['二','두','이','two',1],['三','석','삼','three',1],['四','넉','사','four',1],['五','다섯','오','five',1],['六','여섯','륙','six',1],['七','일곱','칠','seven',1],['八','여덟','팔','eight',1],['九','아홉','구','nine',1],['十','열','십','ten',1],
['日','날','일','day; sun',1],['月','달','월','moon; month',1],['火','불','화','fire',1],['水','물','수','water',1],['木','나무','목','tree; wood',1],['金','쇠','금','metal; gold (also the surname 김)',1],['土','흙','토','earth, soil',1],
['大','큰','대','big',1],['小','작을','소','small',1],['人','사람','인','person',1],['山','메','산','mountain (메 is old Korean for mountain)',1],['門','문','문','gate, door',1],
['東','동녘','동','east',1],['西','서녘','서','west',1],['南','남녘','남','south',1],['北','북녘','북','north',1],
['學','배울','학','learn',1],['校','학교','교','school',1],['敎','가르칠','교','teach',1],['室','집','실','room',1],['先','먼저','선','first, before',1],['生','날','생','be born; life',1],
['父','아비','부','father',1],['母','어미','모','mother',1],['兄','형','형','elder brother',1],['弟','아우','제','younger brother',1],['女','계집','녀','woman',1],['王','임금','왕','king',1],
['國','나라','국','country',1],['軍','군사','군','army, soldier',1],['民','백성','민','the people',1],['年','해','년','year',1],['中','가운데','중','middle',1],['外','바깥','외','outside',1],['韓','나라','한','Korea (Han)',1],['寸','마디','촌','inch; degree of kinship',1],['萬','일만','만','ten thousand',1],['靑','푸를','청','blue-green; young',1],['白','흰','백','white',1],['長','긴','장','long; eldest; chief',1],
['子','아들','자','child, son',2],['男','사내','남','man',2],['口','입','구','mouth; opening',2],['入','들','입','enter',2],['出','날','출','go out',2],['語','말씀','어','language, words',2],['家','집','가','house; family',2],['族','겨레','족','clan, kin',2],['食','밥','식','food; eat',2],['事','일','사','matter, affair',2],['時','때','시','time',2],['間','사이','간','between; interval',2],['上','윗','상','up, above',2],['下','아래','하','down, below',2],['前','앞','전','front; before',2],['後','뒤','후','back; after',2],['午','낮','오','noon',2],['左','왼','좌','left',2],['右','오른','우','right',2],['天','하늘','천','heaven, sky',2],['地','땅','지','earth, land',2],['百','일백','백','hundred',2],['自','스스로','자','self',2],['動','움직일','동','move',2],['車','수레','차','vehicle, cart',2],['電','번개','전','lightning; electric',2],['話','말씀','화','speech, talk',2],['親','친할','친','close, intimate',2],['舊','예','구','old (times)',2],['曜','빛날','요','shine (used in weekdays)',2],['道','길','도','road, way',2],['首','머리','수','head',2],['都','도읍','도','capital, city',2],['名','이름','명','name; famous',2],['手','손','수','hand',2],['足','발','족','foot',2],['心','마음','심','heart, mind',2],
['冊','책','책','book',3],['床','상','상','table, bed',3],['切','끊을','절','cut; earnest',3],['點','점','점','dot, point',3],['雨','비','우','rain',3],['傘','우산','산','umbrella',3],['停','머무를','정','stop',3],['留','머무를','류','stay, remain',3],['場','마당','장','yard, place',3],['市','저자','시','market; city',3],['計','셀','계','count, measure',3],['同','한가지','동','same',3],['胡','되','호','northern tribes; foreign',3]
];
const HJ=Object.fromEntries(HANJA.map(h=>[h[0],{c:h[0],hun:h[1],eum:h[2],en:h[3],lvl:h[4]}]));

// [Korean, hanja ('' = native word), English, level, note]
const VOCAB=[
['사람','','person',1,'Native Korean. The Sino-Korean equivalent is 인 人.'],
['물','','water',1,'Native Korean. Sino-Korean: 수 水, as in 수요일.'],
['불','','fire',1,'Native Korean. Sino-Korean: 화 火.'],
['나무','','tree, wood',1,'Native Korean. Sino-Korean: 목 木.'],
['엄마','','mom',1,'Native Korean, casual. Formal: 어머니.'],
['아빠','','dad',1,'Native Korean, casual. Formal: 아버지.'],
['산','山','mountain',1,''],
['화산','火山','volcano',1,'fire + mountain'],
['대문','大門','main gate',1,'big + gate'],
['남대문','南大門','Namdaemun, the Great South Gate of Seoul',1,''],
['동대문','東大門','Dongdaemun, the Great East Gate of Seoul',1,''],
['학교','學校','school',1,''],
['학생','學生','student',1,'learn + one who lives (生)'],
['선생님','先生','teacher',1,'“one born first”. 님 is a native honorific suffix.'],
['교실','敎室','classroom',1,'teach + room'],
['대학','大學','university',1,'big + learning'],
['부모','父母','parents',1,'father + mother'],
['형제','兄弟','brothers; siblings',1,''],
['한국','韓國','Korea',1,''],
['중국','中國','China',1,'“the middle country”'],
['외국','外國','foreign country',1,'outside + country'],
['외국인','外國人','foreigner',1,''],
['한국인','韓國人','Korean (person)',1,''],

const GRAMMAR=[
{t:'N이에요 / 예요',en:'to be',ex:'Attach to a noun to say “(it) is N”. If the noun ends in a consonant (has 받침), use 이에요; if it ends in a vowel, use 예요. This consonant/vowel switch is the most common pattern in Korean grammar — nearly every particle below works the same way.',
 eg:[['저는 학생이에요.','I am a student.'],['이건 물이에요.','This is water.'],['제 이름은 지아예요.','My name is Jia.'],['저건 나무예요.','That is a tree.']],

{t:'은 / 는',en:'topic marker',ex:'Marks the topic — what the sentence is about, often with a sense of contrast (“as for me…”). 받침 → 은, vowel → 는.',

{t:'이 / 가',en:'subject marker',ex:'Marks the grammatical subject — often new information, or the answer to “who / what?”. 받침 → 이, vowel → 가. Irregular: 저 + 가 = 제가, 나 + 가 = 내가.',
 eg:[['비가 와요.','It’s raining. (rain comes)'],['고양이가 있어요.','There is a cat.'],['책이 없어요.','There is no book.'],['제가 할게요.','I’ll do it.']],

{t:'을 / 를',en:'object marker',ex:'Marks the direct object. 받침 → 을, vowel → 를. Korean puts the verb last: subject – object – verb.',
 eg:[['밥을 먹어요.','I eat (rice).'],['물을 마셔요.','I drink water.'],['커피를 좋아해요.','I like coffee.']],

 q:[['도서관___ 공부해요.',['에','에서'],1],['집___ 가요.',['에','에서'],0],['월요일___ 만나요.',['에','에서'],0]]},
{t:'-아요 / -어요 / -해요',en:'present tense (polite)',ex:'Drop 다 to get the stem. If the stem’s last vowel is ㅏ or ㅗ, add 아요; otherwise add 어요. 하다 verbs become 해요. Vowels merge where they can: 가+아요 → 가요, 보+아요 → 봐요, 마시+어요 → 마셔요.',
 eg:[['가다 → 가요','go'],['먹다 → 먹어요','eat'],['보다 → 봐요','see'],['마시다 → 마셔요','drink'],['공부하다 → 공부해요','study']],

{t:'-았어요 / -었어요',en:'past tense',ex:'Same vowel rule as the present, then ㅆ어요: 았어요 / 었어요 / 했어요.',

{t:'안 / -지 않아요',en:'negation',ex:'Short form: 안 before the verb. Long form: stem + 지 않아요. For noun + 하다 verbs, 안 goes right before 하다: 공부 안 해요.',

const KEY='hanbit-hakdang-v1', DAY=864e5;

var syncT;

function syncNative(){try{const known=ITEMS.filter(i=>i.t==='w'&&i.w[1]&&S.cards[i.id]).slice(-800).map(i=>({ko:i.w[0],hanja:i.w[1],en:i.w[2],hunum:[...i.w[1]].map(c=>HJ[c]?(HJ[c].hun+' '+HJ[c].eum).trim():'').join(' · ')}));window.Hanbit.syncState(JSON.stringify({learned:Object.keys(S.cards).length,known}))}catch(e){}}
let S=Object.assign({cards:{},newPerDay:20,rate:0.9,day:'',newToday:0,streak:0,lastStudy:'',theme:'auto',tab:'today'},load()||{});
function rollDay(){if(S.day!==today()){S.day=today();S.newToday=0;save()}}
rollDay();

/* Learning order: native words of a level, then each hanja followed by every word it unlocks */
const wid=v=>'w:'+v[0]+':'+v[1];
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Daily words delivered by the phone app (from trending topics) — level 4 */
const NATIVE=window.Hanbit||null;
const HOSTED=!NATIVE&&!!document.querySelector('meta[name="hanbit-host"]');
let DAILY=[];
try{if(NATIVE)DAILY=(JSON.parse(NATIVE.dailyWords()||'{}').days)||[];else if(HOSTED)DAILY=(JSON.parse(localStorage.getItem('hanbit-daily')||'{}').days)||[]}catch(e){DAILY=[]}
const DAILY_META={};
DAILY.forEach(day=>(day.words||[]).forEach(w=>{
  (w.chars||[]).forEach(c=>{if(c&&c.c&&!HJ[c.c])HJ[c.c]={c:esc(c.c),hun:esc(c.hun),eum:esc(c.eum),en:esc(c.en),lvl:4}});
  const ko=esc(w.ko),hj=esc(w.hanja);if(!ko||VOCAB.some(v=>v[0]===ko&&v[1]===hj))return;
  const note=[w.grade?'KRDict level: '+esc(w.grade):'',w.example?'In the news: “'+esc(w.example)+'”':''].filter(Boolean).join(' — ');
  const v=[ko,hj,esc(w.en),4,note];if(DAILY_META[wid(v)])return;VOCAB.push(v);DAILY_META[wid(v)]={grade:w.grade||'',date:day.date||''};
}));
const ITEMS=[],pushed=new Set();
function unlockWords(){VOCAB.forEach(v=>{const id=wid(v);if(pushed.has(id)||!v[1]||v[3]===4)return;if([...v[1]].every(c=>pushed.has('h:'+c))){ITEMS.push({id,t:'w',w:v,lvl:v[3]});pushed.add(id)}})}
[1,2,3].forEach(l=>{
  VOCAB.filter(v=>v[3]===l&&!v[1]).forEach(v=>{const id=wid(v);ITEMS.push({id,t:'w',w:v,lvl:l});pushed.add(id)});
  HANJA.filter(h=>h[4]===l).forEach(h=>{const id='h:'+h[0];ITEMS.push({id,t:'h',h:HJ[h[0]],lvl:l});pushed.add(id);unlockWords()});
});
unlockWords();
VOCAB.filter(v=>v[3]===4).forEach(v=>{const id=wid(v);if(pushed.has(id))return;ITEMS.push({id,t:'w',w:v,lvl:4,daily:true,grade:DAILY_META[id].grade,date:DAILY_META[id].date});pushed.add(id)});
const BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const known=id=>!!S.cards[id];

const ttsCb={};window.__ttsDone=id=>{const u=ttsCb[id];delete ttsCb[id];if(u&&u.onend)u.onend()};
function say(t,keep){

function breakdown(ko,hj){
  if(!hj)return'';const s=[...ko.replace(/\s/g,'')];
  return '<div class="bd">'+[...hj].map((c,i)=>{const h=HJ[c];const diff=h&&s[i]&&s[i]!==h.eum;
    return `<div class="bd-cell">${kan(c)}<div class="bd-hun">${h?h.hun+' '+h.eum:''}</div><div class="bd-en">${h?h.en:''}</div>${diff?`<div class="bd-note">read ${s[i]} here</div>`:''}</div>`}).join('<div class="bd-plus">+</div>')+'</div>';

function jhash(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h&0x7fffffff}
function knownForWidget(){return ITEMS.filter(i=>i.t==='w'&&i.w[1]&&S.cards[i.id]).slice(-120).map(i=>[i.w[0],i.w[1]])}
function pickLock(){
  const learned=Object.keys(S.cards).length,known=knownForWidget(),kset=new Set(known.map(k=>k[0])),h=jhash(isoDay());
  const prefer=learned<300?['초급','']:learned<900?['중급','초급','']:['고급','중급','초급',''];
  const latest=DAILY.length?(DAILY[DAILY.length-1].words||[]):[];
  if(!(known.length>=20&&h%3===0)){const fresh=latest.filter(w=>!kset.has(w.ko)&&w.hanja);
    for(const g of prefer){const f=fresh.find(w=>(w.grade||'')===g);if(f)return[esc(f.ko),esc(f.hanja),esc(f.en),0,'']}}
  const find=(ko,hj)=>VOCAB.find(v=>v[0]===esc(ko)&&v[1]===esc(hj));
  if(known.length){const k=known[h%known.length];const v=find(k[0],k[1]);if(v)return v}
  const base=VOCAB.filter(v=>v[1]&&v[3]<4);return base[h%base.length];
}

/* Review — spaced repetition */
const INT=[0,1,2,4,8,16,32,64,128,256];
let session=[],cur=null,revealed=false,sessionDone=0;
function buildSession(){rollDay();const now=Date.now();
  const due=Object.entries(S.cards).filter(([id,c])=>c.due<=now&&BYID[id]).sort((a,b)=>a[1].due-b[1].due).map(x=>x[0]);
  const room=Math.max(0,S.newPerDay-S.newToday),n=Object.keys(S.cards).length;
  const pref=n<300?['초급','']:n<900?['중급','초급','']:['고급','중급','초급',''];
  const dd=ITEMS.filter(i=>i.daily&&!S.cards[i.id]&&pref.includes(i.grade)).sort((a,b)=>pref.indexOf(a.grade)-pref.indexOf(b.grade)||(a.date<b.date?1:-1)).slice(0,Math.ceil(room/4)).map(i=>i.id);
  const reg=ITEMS.filter(i=>!i.daily&&!S.cards[i.id]).slice(0,room-dd.length).map(i=>i.id),fresh=[];
  while(reg.length||dd.length){fresh.push(...reg.splice(0,3));if(dd.length)fresh.push(dd.shift())}
  // weave new items between reviews so sessions don't front-load
  session=[];while(due.length||fresh.length){if(fresh.length)session.push(fresh.shift());if(due.length)session.push(due.shift());if(due.length)session.push(due.shift())}
  cur=session.shift()||null;revealed=false;sessionDone=0;
}
function grade(g){
  let c=S.cards[cur];if(!c){c={box:0,due:0,n:0};S.newToday++}
  c.n++;
  if(g===0){c.box=0;c.due=Date.now();session.splice(Math.min(3,session.length),0,cur)}
  else{c.box=Math.min(INT.length-1,Math.max(1,c.box+(g===1?0:g===2?1:2)));c.due=Date.now()+Math.max(.5,INT[c.box]*(g===1?.5:1))*DAY}
  S.cards[cur]=c;
  const t=today(),y=dstr(new Date(Date.now()-DAY));
  if(S.lastStudy!==t){S.streak=S.lastStudy===y?S.streak+1:1;S.lastStudy=t}
  save();sessionDone++;cur=session.shift()||null;revealed=false;V.review(true);
}
V.review=(keep)=>{
  if(!keep||(!cur&&!session.length))buildSession();
  const m=document.getElementById('main');
  if(!cur){m.innerHTML=`<h1>복습</h1><div class="sheet card"><div class="front"><div class="big">잘했어요!</div><p class="muted">${sessionDone?`You finished ${sessionDone} cards. `:''}Nothing else is due right now.</p>
    <button class="btn" id="more">Learn 10 more</button></div></div>`;
    document.getElementById('more').onclick=()=>{session=ITEMS.filter(i=>!S.cards[i.id]).slice(0,10).map(i=>i.id);cur=session.shift()||null;V.review(true)};return}
  const it=BYID[cur],isNew=!S.cards[cur];
  let front,back,audio;
  if(it.t==='h'){const h=it.h;audio=h.hun+' '+h.eum;
    front=`${kan(h.c,'xl')}<p class="muted">What is its 훈음 — meaning and sound?</p>`;
    back=`<div class="hunum">${h.hun} ${h.eum}</div><div class="muted">${h.en}</div>${wordsWith(h.c).slice(0,5).map(v=>`<div class="eg" style="justify-content:center">${sayBtn(v[0])}<span class="k"><b>${v[0]}</b> ${v[1]}</span><span class="e">${v[2]}</span></div>`).join('')}`;
  }else{const v=it.w;audio=v[0];
    front=`<div class="big">${v[0]}</div>${v[1]?`<div class="hjsub">${v[1]}</div>`:''}<p class="muted">What does it mean?</p>`;
    back=`<div class="big" style="font-size:1.5rem">${v[2]}</div>${breakdown(v[0],v[1])}${v[4]?`<p class="muted" style="margin:0 auto">${v[4]}</p>`:''}`;
  }
  m.innerHTML=`<h1>복습</h1><p class="muted">${session.length+1} left in this session</p>
  <div class="sheet card"><div class="row" style="justify-content:space-between"><span class="tag">${isNew?'New':'Review'} · ${it.daily?'From the news'+(it.grade?' · '+it.grade:''):'Level '+it.lvl}</span>${sayBtn(audio)}</div>
   <div class="front">${front}</div>
   ${revealed?`<div class="back">${back}</div>
   <div class="grades"><button class="g0" data-grade="0">다시<small>again</small></button><button data-grade="1">어려워요<small>hard</small></button><button class="g2" data-grade="2">알아요<small>good</small></button><button data-grade="3">쉬워요<small>easy</small></button></div>`
   :`<button class="btn" id="reveal" style="margin-top:1rem;width:100%">Show answer</button>`}
  </div><p class="muted" style="text-align:center;font-size:.85rem">Keys: space to reveal, 1–4 to grade.</p>`;
  if(revealed)say(audio);
  const r=document.getElementById('reveal');if(r)r.onclick=()=>{revealed=true;V.review(true)};
};

V.settings=()=>{
  const noKo=NATIVE?!NATIVE.ttsOk():(voicesChecked&&!koVoice);let st={};try{if(NATIVE)st=JSON.parse(NATIVE.getSettings())}catch(e){}
  document.getElementById('main').innerHTML=`<h1>설정</h1>
  ${noKo&&NATIVE?`<div class="notice">Your phone has no Korean voice yet. Open text-to-speech settings, choose Google Speech Services, and install Korean voice data. <button class="btn small" id="ttsset">Open settings</button></div>`:''}
  ${noKo&&!NATIVE?`<div class="notice">No Korean voice is installed, so audio may sound wrong. iPhone: Settings › Accessibility › Spoken Content › Voices › Korean. Android: Settings › Text-to-speech › install Korean for Google Speech Services.</div>`:''}
  <div class="sheet">
   <label class="set"><b>New items per day: <span id="npdv">${S.newPerDay}</span></b><br><span class="muted" style="font-size:.9rem">20 is brisk; 40+ is intensive. Reviews grow with it.</span><br><input type="range" id="npd" min="5" max="80" step="5" value="${S.newPerDay}"></label>
   <label class="set"><b>Speech speed: <span id="ratev">${S.rate}</span>×</b><br><input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="${S.rate}"></label>
   <div class="set"><b>Theme</b><div class="row" style="margin-top:.3rem">${['auto','light','dark'].map(t=>`<button class="chip" data-theme-set="${t}" aria-pressed="${S.theme===t}">${t}</button>`).join('')}</div></div>
  </div>
  ${NATIVE?`<h2>Phone</h2><div class="sheet">
   <label class="set"><b>Daily words address</b><br><span class="muted" style="font-size:.9rem">The raw link to data/words.json in your GitHub repo.</span><br><input class="search" id="durl" value="${esc(st.url||'')}" placeholder="https://raw.githubusercontent.com/you/hanbit/main/data/words.json"></label>
   <label class="set"><input type="checkbox" id="wp" ${st.wallpaper?'checked':''}> Put the word of the day on my lock-screen wallpaper</label>
   <div class="row"><button class="btn small" id="upd">Update now</button><span class="muted" style="font-size:.9rem">Last update: ${esc(st.lastUpdate||'never')}</span></div>
  </div>`:''}
  ${HOSTED?`<h2>iPhone lock-screen widget</h2><div class="sheet">
   <p>The widget runs in the free Scriptable app (setup steps are in the README). It picks words at your level, so send it your progress now and then.</p>
   <a class="btn small" href="${widgetLink()}">Send my progress to the widget</a>
  </div>`:''}
  <h2>Back up your progress</h2>
  <p class="muted">Progress is saved in this browser only. Copy this text somewhere safe, or paste a backup to restore it.</p>
  <textarea id="bk">${JSON.stringify({cards:S.cards,newPerDay:S.newPerDay,streak:S.streak,lastStudy:S.lastStudy})}</textarea>
  <div class="row" style="margin-top:.5rem"><button class="btn small" id="copy">Copy backup</button><button class="btn ghost small" id="restore">Restore from text</button><button class="btn ghost small" id="reset" style="margin-left:auto;border-color:var(--miss);color:var(--miss)">Reset all progress</button></div>`;
  const npd=document.getElementById('npd'),rate=document.getElementById('rate');
  if(NATIVE){const put=()=>NATIVE.setSettings(JSON.stringify({url:document.getElementById('durl').value.trim(),wallpaper:document.getElementById('wp').checked}));
    document.getElementById('durl').onchange=put;
    document.getElementById('wp').onchange=()=>{put();toast(document.getElementById('wp').checked?'Lock screen will update shortly':'Lock-screen wallpaper turned off')};
    document.getElementById('upd').onclick=()=>{put();NATIVE.refreshNow();toast('Fetching today’s words…');setTimeout(()=>location.reload(),9000)};
    const ts=document.getElementById('ttsset');if(ts)ts.onclick=()=>NATIVE.openTtsSettings();}
  npd.oninput=()=>{S.newPerDay=+npd.value;document.getElementById('npdv').textContent=S.newPerDay;save()};
  rate.oninput=()=>{S.rate=+rate.value;document.getElementById('ratev').textContent=S.rate;save()};
  rate.onchange=()=>say('안녕하세요');
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('bk').value);toast('Backup copied')}catch(e){document.getElementById('bk').select();toast('Select all and copy')}};
  document.getElementById('restore').onclick=()=>{try{const d=JSON.parse(document.getElementById('bk').value);if(!d.cards)throw 0;Object.assign(S,d);save();toast('Progress restored');V.settings()}catch(e){toast('That text isn’t a valid backup')}};
  document.getElementById('reset').onclick=()=>{if(confirm('Erase all progress? This cannot be undone.')){S.cards={};S.streak=0;S.newToday=0;S.lastStudy='';save();toast('Progress reset');V.settings()}};
};

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-say],[data-go],[data-hl],[data-hs],[data-wl],[data-q],[data-story],[data-toggle],[data-grade],[data-theme-set]');if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){e.preventDefault();say(d.say);return}
  if(d.go){go(d.go);return}
  if(d.hl){hanjaLvl=+d.hl;hanjaSel=null;V.hanja();return}
  if(d.hs){hanjaSel=d.hs;V.hanja();say(HJ[d.hs].hun+' '+HJ[d.hs].eum);window.scrollTo({top:0});return}
  if(d.wl){wl=+d.wl;V.words();return}
  if(d.q){const[g,q,o]=d.q.split('-').map(Number);const ok=GRAMMAR[g].q[q][2]===o;t.classList.add(ok?'ok':'no');if(ok){const qq=GRAMMAR[g].q[q];say(qq[0].replace('___',qq[1][o]).replace(/ →.*$/,'').replace(/[^가-힣\s.?!]/g,'').trim()||qq[1][o])}return}
  if(d.story){storyOpen=+d.story<0?null:+d.story;V.stories();window.scrollTo(0,0);return}
  if(d.toggle){const l=t.closest('.line');l.classList.toggle('show');say(STORIES[storyOpen].lines[+d.toggle][0]);return}
  if(d.grade){grade(+d.grade);return}
  if(d.themeSet){S.theme=d.themeSet;save();applyTheme();V.settings();return}
});
document.addEventListener('keydown',e=>{
  if(S.tab!=='review'||!cur||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.code==='Space'&&!revealed){e.preventDefault();revealed=true;V.review(true)}
  else if(revealed&&['1','2','3','4'].includes(e.key))grade(+e.key-1);
});

renderTabs();go(S.tab||'today');
if(NATIVE)syncNative();
if(HOSTED){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  fetch('data/words.json',{cache:'no-cache'}).then(r=>r.ok?r.text():null).then(t=>{
    if(!t)return;const j=JSON.parse(t);let old=null;try{old=JSON.parse(localStorage.getItem('hanbit-daily')||'null')}catch(e){}
    if(old&&old.generated===j.generated)return;
    try{localStorage.setItem('hanbit-daily',t)}catch(e){return}
    if(!sessionStorage.getItem('hanbit-reloaded')){sessionStorage.setItem('hanbit-reloaded','1');location.reload()}
  }).catch(()=>{});
}
</script>
